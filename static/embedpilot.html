<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EmbedPilot · 嵌入式研发助手</title>
  <style>
    :root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#17324d;background:#f5f8fb}
    *{box-sizing:border-box}body{max-width:980px;margin:40px auto;padding:0 18px}
    h1{margin-bottom:8px}p{line-height:1.6;color:#456078}
    .panel{background:white;padding:24px;border:1px solid #dbe5ed;border-radius:16px;box-shadow:0 8px 28px #dce7ef55}
    textarea{width:100%;min-height:150px;padding:14px;border:1px solid #b8c8d6;border-radius:10px;font:inherit;resize:vertical}
    button{margin-top:12px;background:#1169bb;border:0;color:white;padding:11px 22px;border-radius:8px;font:inherit;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.6}
    .tag{display:inline-block;padding:4px 9px;background:#e7f3ff;border-radius:6px;font-size:13px;margin-right:7px}
    a{color:#1169bb}li{margin:8px 0;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <h1>EmbedPilot</h1>
  <p>查询 Zephyr 开发文档，粘贴 GCC / Clang / MSVC 编译日志，或用 <code>```c</code> 代码块提交 C/C++ 片段做 Cppcheck 静态分析。系统不编译或执行你的代码，也不修改原文件。</p>
  <p>注意：若已配置 DeepSeek API，点击“分析”会将输入和相关文档片段发送给模型服务。请勿粘贴私有或敏感代码。</p>
  <div class="panel">
    <textarea id="question" placeholder="例如：What is priority inheritance for a mutex?&#10;或：src/main.c:42:7: error: implicit declaration of function k_sem_take"></textarea>
    <br><button id="submit">分析</button>
    <p id="status"></p>
  </div>
  <div class="panel" id="result" style="display:none;margin-top:18px">
    <div id="tags"></div>
    <pre id="answer"></pre>
    <h3>来源</h3><ol id="sources"></ol>
  </div>
  <script>
    const submit=document.getElementById('submit');
    submit.addEventListener('click',async()=>{
      const question=document.getElementById('question').value.trim();
      if(!question)return;
      submit.disabled=true;document.getElementById('status').textContent='正在分析…';
      try{
        const response=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});
        const data=await response.json();if(!response.ok)throw new Error(data.detail||response.statusText);
        document.getElementById('result').style.display='block';
        document.getElementById('answer').textContent=data.answer;
        document.getElementById('tags').textContent=`路径：${data.route}　证据：${data.evidence_ok?'已找到':'不足'}　模式：${data.mode}`;
        const sources=document.getElementById('sources');sources.replaceChildren();
        for(const item of data.citations){const li=document.createElement('li');const a=document.createElement('a');a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=`${item.section} · ${item.path}`;li.append(a);sources.append(li)}
        document.getElementById('status').textContent='完成';
      }catch(error){document.getElementById('status').textContent=`出错：${error.message}`}
      finally{submit.disabled=false}
    });
  </script>
</body>
</html>
